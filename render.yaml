services:
  - type: web
    name: road-sight-ai
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install streamlit
    startCommand: streamlit run app.py --server.port $PORT --server.headless true --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
